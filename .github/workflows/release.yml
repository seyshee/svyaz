name: Release Go server
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go vet ./... && go test -race ./...
      - run: go build -trimpath -tags sqlite_omit_load_extension,netgo -ldflags='-linkmode external -extldflags -static' -o svyaz-linux-amd64 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-server
          path: svyaz-linux-amd64
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-server
      - run: gh release create "$GITHUB_REF_NAME" svyaz-linux-amd64 --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
